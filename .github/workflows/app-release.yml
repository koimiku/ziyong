name: Build anime
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-release-version.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - if: matrix.target == 'windows'
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.14.0'
      - working-directory: flutter_app
        run: flutter pub get --enforce-lockfile
      - working-directory: flutter_app
        run: dart format --output=none --set-exit-if-changed lib test
      - working-directory: flutter_app
        run: flutter analyze --fatal-infos
      - working-directory: flutter_app
        run: flutter test
      - if: matrix.target == 'android'
        run: python scripts/build-flutter-android.py --no-pub
      - if: matrix.target == 'windows'
        working-directory: flutter_app
        run: flutter build windows --release --no-pub
      - if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/copy-vc-runtime.ps1 -Destination flutter_app/build/windows/x64/runner/Release
          Compress-Archive -Path flutter_app/build/windows/x64/runner/Release/* -DestinationPath "anime-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: anime-${{ matrix.target }}
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            anime-*-windows-x64.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish complete release without replacing an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          cd dist
          test -f app-release.apk
          sha256sum app-release.apk anime-*-windows-x64.zip > sha256sums.txt
          gh release create "$RELEASE_TAG" app-release.apk anime-*-windows-x64.zip sha256sums.txt --verify-tag --title "$RELEASE_TAG" --generate-notes
