name: Publish verified release artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag
        required: true
      run_id:
        description: Build anime run with successful Android and Windows builds
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify immutable tag and successful platform builds
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .path)" = '.github/workflows/app-release.yml'
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs" > /tmp/build-jobs.json
          jq -e '[.jobs[] | select(.name | startswith("build ("))] | length == 2 and all(.[]; .conclusion == "success")' /tmp/build-jobs.json
          node scripts/check-release-version.mjs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
          path: dist
          merge-multiple: true
      - name: Publish without replacing an existing release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          cd dist
          apk=$(find . -type f -name app-release.apk -print -quit)
          test -n "$apk"
          if [ "$apk" != './app-release.apk' ]; then cp "$apk" app-release.apk; fi
          test -f app-release.apk
          test -f "anime-${RELEASE_TAG#v}-windows-x64.zip"
          sha256sum app-release.apk anime-*-windows-x64.zip > sha256sums.txt
          gh release create "$RELEASE_TAG" app-release.apk anime-*-windows-x64.zip sha256sums.txt --verify-tag --title "$RELEASE_TAG" --generate-notes
