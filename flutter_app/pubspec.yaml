name: anime_flutter
description: "anime Android and Windows client"
publish_to: 'none'
version: 1.6.2+35

environment:
  sdk: ^3.13.5

dependencies:
  audio_session: ^0.2.4
  cookie_jar: ^4.0.9
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.2.0-beta.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  html: ^0.15.7
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  screen_brightness: ^2.1.11
  share_plus: ^13.3.1
  sqflite: ^2.4.4+2
  sqflite_common_ffi: ^2.4.4
  url_launcher: ^6.3.3
  volume_controller: ^3.7.1
  wakelock_plus: ^1.8.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rules.json
    - assets/phone.html
    - assets/phone.js
    - assets/hls.min.js
    - assets/HLS-LICENSE.txt
