<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>anime · 手机观看</title><meta name="referrer" content="no-referrer">
<style>body{margin:0;background:#f7f9ff;color:#172137;font:16px system-ui}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:26px}nav,.row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}input,button,select{font:inherit;border:0;border-radius:16px;padding:12px;background:#e7edfa;color:inherit}button{cursor:pointer}input{flex:1;min-width:120px}button.primary{background:#3866a6;color:white}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:16px}.card{padding:0;text-align:left;background:transparent}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px}.card span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:8px 0}#sources button{display:block;width:100%;margin:8px 0;text-align:left}video{width:100%;max-height:70vh;background:black;border-radius:16px}#status{color:#5c6b83;white-space:pre-line}.episodes{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}#watch[hidden]{display:none}@media(prefers-color-scheme:dark){body{background:#161218;color:#eee3eb}input,button,select{background:#342a34}button.primary{background:#a64272}#status{color:#c6b8c4}}</style>
